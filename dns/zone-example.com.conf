; zone-example.com.conf — Forward DNS Zone for example.com
; Place this file in /etc/bind/zones/

$TTL    86400
@       IN      SOA     ns1.example.com. admin.example.com. (
                        2024010101  ; Serial (YYYYMMDDNN)
                        3600        ; Refresh — 1 hour
                        1800        ; Retry — 30 minutes
                        604800      ; Expire — 1 week
                        86400 )     ; Negative TTL — 1 day

; Name servers
@       IN      NS      ns1.example.com.
@       IN      NS      ns2.example.com.

; A records — Name to IP
@       IN      A       192.168.1.10
ns1     IN      A       192.168.1.10
ns2     IN      A       192.168.1.11
www     IN      A       192.168.1.20
mail    IN      A       192.168.1.30
vpn     IN      A       192.168.1.40
monitor IN      A       192.168.1.50

; CNAME records — Aliases
ftp     IN      CNAME   www.example.com.
blog    IN      CNAME   www.example.com.

; MX records — Mail servers
@       IN      MX      10 mail.example.com.

; TXT records — SPF
@       IN      TXT     "v=spf1 mx a ip4:192.168.1.30 -all"

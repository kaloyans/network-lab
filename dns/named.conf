// named.conf — BIND9 DNS Server Configuration
// Reference configuration for a authoritative + recursive DNS server

options {
    directory "/var/cache/bind";

    // Listen on all interfaces
    listen-on { any; };
    listen-on-v6 { any; };

    // Allow queries from local network only
    allow-query { localhost; 192.168.1.0/24; };

    // Allow recursion for internal clients only
    allow-recursion { localhost; 192.168.1.0/24; };

    // Forward unresolved queries to upstream DNS
    forwarders {
        8.8.8.8;    // Google DNS
        1.1.1.1;    // Cloudflare DNS
    };

    forward only;

    // Security options
    dnssec-validation auto;
    auth-nxdomain no;

    // Disable zone transfers by default
    allow-transfer { none; };
};

// Logging configuration
logging {
    channel default_log {
        file "/var/log/named/named.log" versions 3 size 5m;
        severity dynamic;
        print-time yes;
        print-severity yes;
        print-category yes;
    };
    category default { default_log; };
    category queries { default_log; };
};

// Internal zone
zone "example.com" {
    type master;
    file "/etc/bind/zones/zone-example.com.conf";
    allow-transfer { none; };
};

// Reverse zone for 192.168.1.0/24
zone "1.168.192.in-addr.arpa" {
    type master;
    file "/etc/bind/zones/zone-192.168.1.rev";
    allow-transfer { none; };
};

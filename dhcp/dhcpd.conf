# dhcpd.conf — ISC DHCP Server Configuration
# Place this file in /etc/dhcp/dhcpd.conf

# Global settings
default-lease-time 86400;      # 24 hours
max-lease-time 172800;         # 48 hours
authoritative;

# DNS settings
option domain-name "example.com";
option domain-name-servers 192.168.1.10, 192.168.1.11;

# Logging
log-facility local7;

# Subnet declaration — 192.168.1.0/24
subnet 192.168.1.0 netmask 255.255.255.0 {

    # DHCP pool range
    range 192.168.1.100 192.168.1.200;

    # Default gateway
    option routers 192.168.1.1;

    # Subnet mask
    option subnet-mask 255.255.255.0;

    # Broadcast address
    option broadcast-address 192.168.1.255;

    # NTP server
    option ntp-servers 192.168.1.1;
}

# Static leases — fixed IP by MAC address
host server-01 {
    hardware ethernet 00:11:22:33:44:55;
    fixed-address 192.168.1.10;
    option host-name "server-01";
}

host server-02 {
    hardware ethernet 00:11:22:33:44:66;
    fixed-address 192.168.1.11;
    option host-name "server-02";
}

host monitoring {
    hardware ethernet 00:11:22:33:44:77;
    fixed-address 192.168.1.50;
    option host-name "monitoring";
}

host vpn-gateway {
    hardware ethernet 00:11:22:33:44:88;
    fixed-address 192.168.1.40;
    option host-name "vpn-gateway";
}

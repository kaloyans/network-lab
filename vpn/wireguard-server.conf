# wireguard-server.conf — WireGuard VPN Server Configuration
# Place this file in /etc/wireguard/wg0.conf
# Start with: wg-quick up wg0
# Stop with:  wg-quick down wg0
# Status:     wg show

[Interface]
# Server private key — generate with: wg genkey
PrivateKey = <SERVER_PRIVATE_KEY>

# VPN network interface IP
Address = 10.0.0.1/24

# WireGuard listening port
ListenPort = 51820

# Save peer config changes automatically
SaveConfig = false

# Firewall rules — enable routing and NAT
PostUp = iptables -A FORWARD -i wg0 -j ACCEPT
PostUp = iptables -A FORWARD -o wg0 -j ACCEPT
PostUp = iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT
PostDown = iptables -D FORWARD -o wg0 -j ACCEPT
PostDown = iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

# Enable IP forwarding (also set in /etc/sysctl.conf)
# net.ipv4.ip_forward = 1

# ── PEER 1 — Remote Laptop ────────────────────────────────────────────────────
[Peer]
# Peer public key — generate with: wg pubkey < private.key
PublicKey = <PEER1_PUBLIC_KEY>

# IP address assigned to this peer
AllowedIPs = 10.0.0.2/32

# Optional — keepalive for peers behind NAT
PersistentKeepalive = 25

# ── PEER 2 — Remote Office ────────────────────────────────────────────────────
[Peer]
PublicKey = <PEER2_PUBLIC_KEY>
AllowedIPs = 10.0.0.3/32
PersistentKeepalive = 25

# ── PEER 3 — Mobile Device ────────────────────────────────────────────────────
[Peer]
PublicKey = <PEER3_PUBLIC_KEY>
AllowedIPs = 10.0.0.4/32
PersistentKeepalive = 25
